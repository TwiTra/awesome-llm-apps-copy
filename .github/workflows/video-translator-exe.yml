name: video-translator-exe

# Builds the Windows program of starter_ai_agents/ai_video_translator with PyInstaller and
# checks it by running the packaged program's own self-test.
#   - Run it by hand (Actions tab -> "Run workflow") or by opening a PR that touches the app.
#   - Push a tag like  video-translator-v1.0  to also publish both downloads as a GitHub release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "starter_ai_agents/ai_video_translator/**"
      - ".github/workflows/video-translator-exe.yml"
  push:
    tags:
      - "video-translator-v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: starter_ai_agents/ai_video_translator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: starter_ai_agents/ai_video_translator/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build the folder version and run its self-test
        run: python build_exe.py --test --zip

      - name: Build the single-file .exe and run its self-test
        run: python build_exe.py --onefile --test

      - uses: actions/upload-artifact@v4
        with:
          name: VideoUebersetzer-Ordner
          path: starter_ai_agents/ai_video_translator/dist/VideoUebersetzer-windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: VideoUebersetzer-exe
          path: starter_ai_agents/ai_video_translator/dist/VideoUebersetzer.exe
          if-no-files-found: error

      # After the uploads, so that a failing unit test never costs you the build.
      - name: Unit tests
        if: always()
        run: python -m unittest -v

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/video-translator-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "downloads/VideoUebersetzer-exe/VideoUebersetzer.exe" \
            "downloads/VideoUebersetzer-Ordner/VideoUebersetzer-windows.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Video-Übersetzer ${GITHUB_REF_NAME#video-translator-v}" \
            --notes "Windows-Programm des Video-Übersetzers. VideoUebersetzer.exe ist eine einzelne Datei (startet langsamer), VideoUebersetzer-windows.zip enthält den Ordner (entpacken, VideoUebersetzer.exe starten, startet schneller)."
